<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpenSight - Reset Password</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="mobile-topbar mobile-topbar-simple" id="mobileTopbar">
      <a class="mobile-brand" href="login.html" aria-label="SpenSight home">
        <div class="brand-badge" id="mobileBrandBadge"><span data-icon="Wallet"></span></div>
        <span class="mobile-brand-name">SpenSight</span>
      </a>
    </header>
    <div class="auth-layout">
      <div class="welcome-panel">
        <div class="brand-header">
          <div class="brand-badge"><span data-icon="Wallet"></span></div>
          <span>SpenSight</span>
        </div>
        <div class="welcome-body">
          <p class="hero-eyebrow"><span data-icon="Sparkles"></span> RESET YOUR PASSWORD</p>
          <h1 class="hero-heading">Create a <span>new password.</span></h1>
          <p class="sub-text">Choose a strong, secure password to regain access to your SpenSight dashboard.</p>
        </div>
        <p style="font-size: 12px; color: var(--text-muted)">© 2026 SpenSight. All rights reserved.</p>
      </div>
      <div>
        <div class="auth-card">
          <h2 style="font-size: 24px; font-weight: 800">Reset Password</h2>
          <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px" id="resetSubtitle">Enter and confirm your new password.</p>
          <form id="resetPasswordForm" style="margin-top: 24px" novalidate>
            <div style="margin-bottom: 16px">
              <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px">New Password</label>
              <div style="position: relative">
                <span data-icon="Lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></span>
                <input type="password" id="newPassword" class="input-field" placeholder="Minimum 8 characters" style="padding-left: 40px" autocomplete="new-password" required minlength="8" />
              </div>
            </div>
            <div style="margin-bottom: 20px">
              <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px">Confirm New Password</label>
              <div style="position: relative">
                <span data-icon="Lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></span>
                <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter your new password" style="padding-left: 40px" autocomplete="new-password" required minlength="8" />
              </div>
              <p id="passwordError" style="color: #fca5a5; font-size: 12px; margin-top: 6px; display: none">Passwords do not match.</p>
            </div>
            <button type="submit" id="resetSubmitBtn" class="btn-primary" style="width: 100%">Reset Password</button>
          </form>
          <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted)">
            <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600">Back to login</a>
          </div>
        </div>
      </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
