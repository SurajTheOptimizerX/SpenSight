services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=financial_dashboard
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me-please}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5000,http://localhost:3000,http://127.0.0.1:5000,http://localhost:5500,http://127.0.0.1:5500}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-SpenSight <noreply@spensight.app>}
      - VERIFY_PAGE_URL=${VERIFY_PAGE_URL:-http://localhost:5000}
      - APP_NAME=${APP_NAME:-SpenSight}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=financial_dashboard
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"